<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSH image stream test</title>
<style>
body{font:16px system-ui;background:#101827;color:#e8edf7;margin:24px}button,input,select{font:inherit;margin:6px;padding:6px}canvas{width:100%;background:#000}main{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1350px}h2{font-size:18px}#status{min-height:2em;color:#90dfdb}@media(max-width:700px){main{grid-template-columns:1fr}}
</style>
<h1>OSH image stream test</h1>
<p id="mode">Connecting…</p>
<p>Select images to replay in filename order, or use the supplied sample. Each result is drawn on the exact submitted frame.</p>
<input id="files" type="file" accept="image/*" multiple aria-label="Replay images">
<label>Target FPS <input id="fps" type="number" min="1" max="60" value="10"></label>
<label>Channels <select id="channels"><option>1</option><option>2</option><option>4</option><option>8</option></select></label>
<button id="start">Start stream</button><button id="stop">Stop</button>
<p id="status" role="status">Ready</p>
<main><section><h2>Original RGB input</h2><canvas id="original" width="640" height="640"></canvas></section>
<section><h2>Output with detections</h2><canvas id="output" width="640" height="640"></canvas></section></main>
<script>
const original=document.querySelector('#original'),output=document.querySelector('#output');
const inputCtx=original.getContext('2d',{willReadFrequently:true}),outCtx=output.getContext('2d');
const status=document.querySelector('#status');let running=false,images=[],config;
const load=src=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(Error('Unable to decode image'));img.src=src;});
async function init(){config=await(await fetch('/config')).json();document.querySelector('#mode').textContent=config.mode==='mock'?'MOCK: moving test marker only; no model inference or NPU validation.':'EXTERNAL: detections from the existing Hailo inference driver.';images=[await load('/sample.png')];inputCtx.drawImage(images[0],0,0,640,640);}
const ready=init().catch(e=>{status.textContent=e.message;throw e;});
document.querySelector('#stop').onclick=()=>{running=false;};
document.querySelector('#start').onclick=async()=>{
 if(running)return;running=true;document.querySelector('#start').disabled=true;
 const urls=[];
 try{
  await ready;
  const files=Array.from(document.querySelector('#files').files).sort((a,b)=>a.name.localeCompare(b.name));
  if(files.length){images=[];for(const file of files){const url=URL.createObjectURL(file);urls.push(url);images.push(await load(url));}}
  const fps=Number(document.querySelector('#fps').value),channels=Number(document.querySelector('#channels').value);
  if(!Number.isFinite(fps)||fps<1||fps>60)throw Error('FPS must be between 1 and 60');
  let count=0;
  while(running){
   const started=performance.now(),channel=count%channels;
   inputCtx.drawImage(images[Math.floor(count/channels)%images.length],0,0,640,640);
   const pixels=inputCtx.getImageData(0,0,640,640),rgb=new Uint8Array(640*640*3);
   for(let i=0,j=0;i<pixels.data.length;i+=4){rgb[j++]=pixels.data[i];rgb[j++]=pixels.data[i+1];rgb[j++]=pixels.data[i+2];}
   const response=await fetch('/frame',{method:'POST',headers:{'X-Channel':String(channel)},body:rgb});
   const result=await response.json();if(!response.ok)throw Error(result.error);
   outCtx.putImageData(pixels,0,0);outCtx.strokeStyle='#ff534a';outCtx.fillStyle='#ff534a';outCtx.lineWidth=3;outCtx.font='18px system-ui';
   for(const [x0,y0,x1,y1,score,cls] of result.detections){outCtx.strokeRect(x0,y0,x1-x0,y1-y0);outCtx.fillText(cls===-1?'MOCK marker':`class ${cls} ${(score*100).toFixed(1)}%`,x0,Math.max(20,y0-8));}
   count++;status.textContent=`${config.mode.toUpperCase()} · channel ${channel} · sequence ${result.sequence} · ${result.detections.length} detections · ${result.latency_ms.toFixed(1)} ms round trip · ${count} frames`;
   await new Promise(r=>setTimeout(r,Math.max(0,1000/fps-(performance.now()-started))));
  }
  status.textContent+=' · stopped';
 }catch(e){status.textContent=e.message;}
 finally{running=false;document.querySelector('#start').disabled=false;for(const url of urls)URL.revokeObjectURL(url);}
};
</script>
</html>
