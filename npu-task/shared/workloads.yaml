apiVersion: npu.snu-rtos.io/v1alpha1
kind: NPUTask
metadata: {name: share-a}
spec:
  image: npu-share-client:local
  command: [/usr/local/bin/shared_runner]
  args: [--hef, $(MODEL_PATH), --runs, "2000"]
  model: {path: /opt/models/yolov10s.hef, key: yolov10s}
  npuShare: 600
  mode: Batch
