apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nputasks.npu.snu-rtos.io
spec:
  group: npu.snu-rtos.io
  scope: Namespaced
  names:
    plural: nputasks
    singular: nputask
    kind: NPUTask
    shortNames:
    - nput
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: NPUs
      type: integer
      jsonPath: .spec.npuCount
    - name: Mode
      type: string
      jsonPath: .spec.mode
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Node
      type: string
      jsonPath: .status.nodeName
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion: &id001
            type: string
          kind: *id001
          metadata:
            type: object
          spec:
            type: object
            required:
            - image
            - command
            - model
            - npuCount
            properties:
              image:
                type: string
                minLength: 1
              command:
                type: array
                minItems: 1
                items:
                  type: string
                  minLength: 1
              args:
                type: array
                items: *id001
              env:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - name
                items:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                    value: *id001
                    valueFrom:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                x-kubernetes-validations:
                - rule: self.all(e, e.name != 'NPU_COUNT' && e.name != 'MODEL_PATH')
                  message: NPU_COUNT and MODEL_PATH are reserved
              resources:
                type: object
                properties:
                  requests: &id002
                    type: object
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      x-kubernetes-int-or-string: true
                    x-kubernetes-validations:
                    - rule: self.all(k, k in ['cpu', 'memory'])
                      message: Only cpu and memory are supported; use npuCount for
                        NPUs
                  limits: *id002
              model:
                type: object
                required:
                - path
                properties:
                  path:
                    type: string
                    pattern: ^/
                  pvc: *id001
                  mountPath:
                    type: string
                    pattern: ^/
                x-kubernetes-validations:
                - rule: '!has(self.pvc) || self.pvc == '''' || (has(self.mountPath)
                    && self.mountPath != ''/'' && self.path.startsWith(self.mountPath
                    + ''/''))'
                  message: PVC models require mountPath and a model path inside it
              npuCount:
                type: integer
                minimum: 1
                maximum: 8
              suspend:
                type: boolean
                default: false
              mode:
                type: string
                enum:
                - Batch
                - Service
                default: Batch
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              podName: *id001
              nodeName: *id001
              phase: *id001
              executionHash: *id001
              conditions:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - type
                items:
                  type: object
                  required:
                  - type
                  - status
                  - reason
                  - message
                  - lastTransitionTime
                  properties:
                    type: *id001
                    status:
                      type: string
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                    reason: *id001
                    message: *id001
                    lastTransitionTime:
                      type: string
                      format: date-time
                    observedGeneration:
                      type: integer
                      format: int64
