apiVersion: v1
kind: Namespace
metadata:
  name: osh-vision
---
apiVersion: npu.snu-rtos.io/v1alpha1
kind: NPUTask
metadata:
  name: detection
  namespace: osh-vision
spec:
  image: osh-vision-detection:v2
  command: [/app/vision_worker]
  args: [--kind, detection]
  model: {path: /models/yolov10s.hef}
  npuCount: 1
  mode: Service
  visual: {session: demo, nodeName: ava}
  resources:
    requests: {cpu: '1', memory: 256Mi}
    limits: {cpu: '2', memory: 512Mi}
---
apiVersion: npu.snu-rtos.io/v1alpha1
kind: NPUTask
metadata:
  name: segmentation
  namespace: osh-vision
spec:
  image: osh-vision-segmentation:v2
  command: [/app/vision_worker]
  args: [--kind, segmentation]
  model: {path: /models/yolov8n_seg.hef}
  npuCount: 1
  mode: Service
  visual: {session: demo, nodeName: ava}
  resources:
    requests: {cpu: '1', memory: 256Mi}
    limits: {cpu: '2', memory: 512Mi}
---
apiVersion: npu.snu-rtos.io/v1alpha1
kind: NPUTask
metadata:
  name: pose
  namespace: osh-vision
spec:
  image: osh-vision-pose:v2
  command: [/app/vision_worker]
  args: [--kind, pose]
  model: {path: /models/yolov8s_pose.hef}
  npuCount: 1
  mode: Service
  visual: {session: demo, nodeName: ava}
  resources:
    requests: {cpu: '1', memory: 256Mi}
    limits: {cpu: '2', memory: 512Mi}
